<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <style>
    .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #000; text-anchor: middle; opacity: 0; animation: aparecer 1.2s ease-out forwards; }
    .d { animation-delay: .4s; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <g>
    <path fill="#fff" d="M0 0 H2400 V200 Q2250 255 2100 200 T1800 200 T1500 200 T1200 200 T900 200 T600 200 T300 200 T0 200 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text class="t" x="600" y="105" font-size="72" font-weight="700">FaxtAl</text>
  <text class="t d" x="600" y="148" font-size="24">Desarrollador Full Stack en formación</text>
</svg>
